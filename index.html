<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ألبوم ذكريات الأحباب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-amber-50/40 min-h-screen text-slate-800 pb-12">

  <header class="bg-gradient-to-r from-amber-700 via-amber-600 to-amber-800 text-white shadow-lg mb-8">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-2">ألبوم ذكريات الأحباب 📸✨</h1>
      <p class="text-amber-100 text-sm md:text-base">ملتقى الصور والذكريات الجميلة للعائلة والأحباب</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4">
    <!-- Password Lock View -->
    <div id="auth-card" class="bg-white rounded-2xl shadow-md border border-amber-100 p-6 md:p-8 max-w-md mx-auto text-center">
      <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        🔒
      </div>
      <h2 class="text-xl font-bold mb-2">رمز الدخول العائلي</h2>
      <p class="text-slate-500 text-sm mb-6">يرجى إدخال رمز الدخول الخاص بالعائلة لعرض وإضافة الذكريات</p>
      
      <form id="login-form" onsubmit="checkPasscode(event)" class="space-y-4">
        <input type="password" id="passcode-input" placeholder="أدخل الرمز السري هنا" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-center text-lg">
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl shadow transition duration-200">
          دخول الألبوم
        </button>
      </form>
      <p id="auth-error" class="text-red-500 text-sm mt-3 hidden">الرمز السري غير صحيح، يرجى المحاولة مرة أخرى.</p>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="app-content" class="hidden space-y-8">
      <!-- Upload Box -->
      <div class="bg-white rounded-2xl shadow-md border border-amber-100 p-6">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-amber-800">
          <span>➕</span> إضافة ذكرى جديدة
        </h2>
        <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">اختر الصورة</label>
            <input type="file" id="photo-input" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">وصف الذكرى / تعليق</label>
            <input type="text" id="caption-input" placeholder="اكتب تعليقاً بسيطاً عن هذه الصورة..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
          <button type="submit" id="upload-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2">
            <span>رفع الصورة إلى الألبوم</span>
          </button>
        </form>
      </div>

      <!-- Gallery Grid -->
      <div>
        <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
          <span>🖼️</span> معرض الذكريات
        </h2>
        <div id="photos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <!-- Photos will be inserted here -->
        </div>
        <div id="empty-state" class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 hidden">
          <p class="text-slate-500">لا توجد صور مضافة حتى الآن. كن أول من يضيف ذكرى!</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Configuration
    const FAMILY_PASSCODE = "Ahbab2026"; 
    const SUPABASE_URL = "https://cckl130sa-abu-ahmad.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNja2wxMzBzYS1hYnUtYWhtYWQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2NzE1ODcxOCwiZXhwIjoyMDgyNzM0NzE4fQ.aK_3o_pX2P0Q_1q9L8m2O3N4P5Q6R7S8T9U0V1W2X3Y";

    let supabaseClient = null;
    if (typeof supabase !== 'undefined') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function checkPasscode(e) {
      e.preventDefault();
      const input = document.getElementById('passcode-input').value;
      if (input === FAMILY_PASSCODE) {
        document.getElementById('auth-card').classList.add('hidden');
        document.getElementById('app-content').classList.remove('hidden');
        loadPhotos();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    async function loadPhotos() {
      const grid = document.getElementById('photos-grid');
      const emptyState = document.getElementById('empty-state');
      
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient.from('photos').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        grid.innerHTML = '';
        if (!data || data.length === 0) {
          emptyState.classList.remove('hidden');
        } else {
          emptyState.classList.add('hidden');
          data.forEach(photo => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100';
            card.innerHTML = `
              <img src="${photo.url}" class="w-full h-48 object-cover" alt="ذكرى">
              <div class="p-4">
                <p class="text-slate-700 text-sm font-medium">${photo.caption || 'بدون تعليق'}</p>
                <span class="text-xs text-slate-400 mt-2 block">${new Date(photo.created_at).toLocaleDateString('ar-SA')}</span>
              </div>
            `;
            grid.appendChild(card);
          });
        }
      } catch (err) {
        console.error("Error loading photos:", err);
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      const btn = document.getElementById('upload-btn');
      const fileInput = document.getElementById('photo-input');
      const captionInput = document.getElementById('caption-input');
      const file = fileInput.files[0];

      if (!file) return;

      btn.disabled = true;
      btn.innerText = "جاري الرفع...";

      try {
        const fileName = `${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('family-photos').upload(fileName, file);
        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage.from('family-photos').getPublicUrl(fileName);
        const photoUrl = publicUrlData.publicUrl;

        const { error: dbError } = await supabaseClient.from('photos').insert([{ url: photoUrl, caption: captionInput.value }]);
        if (dbError) throw dbError;

        alert("تمت إضافة الذكرى بنجاح! 🎉");
        fileInput.value = '';
        captionInput.value = '';
        loadPhotos();
      } catch (err) {
        alert("تنبيه: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "رفع الصورة إلى الألبوم";
      }
    }
  </script>
</body>
</html>
